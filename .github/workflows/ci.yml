name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  policy:
    name: Policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_no_assets.py
      - run: python scripts/sync_skills.py --check

  build-test:
    name: Build and test (${{ matrix.os }})
    needs: policy
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain version comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r harness/requirements.txt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: python -m pytest harness/tests/synthetic -q
      - name: Cross-platform determinism digest
        run: python harness/tools/golden_digest.py --check harness/fixtures/synthetic_corridor.json
      - name: Upload synthetic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-${{ matrix.os }}
          path: harness/out/synthetic
          if-no-files-found: ignore
