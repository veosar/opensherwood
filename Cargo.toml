[workspace]
resolver = "3"
members = [
    "crates/opensherwood-formats",
    "crates/opensherwood-assets",
    "crates/opensherwood-core",
    "crates/opensherwood-script",
    "crates/opensherwood-render",
    "crates/opensherwood-audio",
    "crates/opensherwood-protocol",
    "crates/opensherwood-app",
    "crates/opensherwood-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/veosar/opensherwood"
rust-version = "1.95"

[workspace.dependencies]
opensherwood-formats = { path = "crates/opensherwood-formats" }
opensherwood-assets = { path = "crates/opensherwood-assets" }
opensherwood-core = { path = "crates/opensherwood-core" }
opensherwood-script = { path = "crates/opensherwood-script" }
opensherwood-render = { path = "crates/opensherwood-render" }
opensherwood-audio = { path = "crates/opensherwood-audio" }
opensherwood-protocol = { path = "crates/opensherwood-protocol" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
flate2 = "1"
bzip2 = "0.5"
blake3 = "1"
png = "0.17"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"

[profile.release]
debug = 1
lto = "thin"
